<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4285f4">
    <title>Google Calendar PWA</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button class="menu-btn" id="menuBtn">☰</button>
                <div class="date-display">
                    <h1 class="current-date" id="currentDate"></h1>
                    <p class="current-weekday" id="currentWeekday"></p>
                </div>
            </div>
            <div class="header-right">
                <button class="search-btn" id="searchBtn">🔍</button>
                <button class="today-btn" id="todayBtn">Сегодня</button>
            </div>
        </header>

        <!-- Calendar Container for Swipe -->
        <div class="calendar-container" id="calendarContainer">
            <!-- Main Calendar (will be duplicated for swipe) -->
            <div class="calendar-wrapper" id="calendarWrapper">
                <div class="calendar" id="calendar">
                    <!-- Time column integrated into grid -->
                    <div class="time-grid" id="timeGrid"></div>
                    
                    <!-- Events container -->
                    <div class="events-container" id="eventsContainer"></div>
                    
                    <!-- Current time line -->
                    <div class="current-time-line" id="currentTimeLine"></div>
                    
                    <!-- Event preview (transparent draggable event) -->
                    <div class="event-preview" id="eventPreview"></div>
                    
                    <!-- Hour labels -->
                    <div class="hour-labels" id="hourLabels"></div>
                </div>
            </div>
        </div>

        <!-- Add Event Button -->
        <button class="add-event-btn" id="addEventBtn">
            <span>+</span>
        </button>

        <!-- Bottom Sheet -->
        <div class="bottom-sheet" id="bottomSheet">
            <div class="sheet-header">
                <div class="drag-handle" id="dragHandle"></div>
            </div>
            <div class="sheet-content">
                <div class="sheet-collapsed">
                    <input type="text" 
                           class="event-title-input" 
                           id="eventTitleInput"
                           placeholder="Добавить название события"
                           autocomplete="off">
                </div>
                <div class="sheet-expanded">
                    <div class="form-group">
                        <label>Цвет события</label>
                        <div class="color-picker" id="colorPicker">
                            <!-- Colors will be generated by JS -->
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Начало</label>
                            <div class="time-display" id="startTimeDisplay">09:00</div>
                        </div>
                        <div class="form-group">
                            <label>Конец</label>
                            <div class="time-display" id="endTimeDisplay">10:00</div>
                        </div>
                    </div>

                    <div class="form-group date-group">
                        <label>Дата</label>
                        <div class="date-display-sheet" id="dateDisplaySheet"></div>
                    </div>

                    <div class="form-group">
                        <label>Повторение</label>
                        <select id="repeatSelect" class="select-input">
                            <option value="none">Не повторяется</option>
                            <option value="daily">Ежедневно</option>
                            <option value="weekly">Еженедельно</option>
                            <option value="monthly">Ежемесячно</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Описание</label>
                        <textarea id="eventDescription" 
                                  class="description-input" 
                                  placeholder="Добавить описание"
                                  rows="3"></textarea>
                    </div>

                    <div class="form-actions">
                        <button class="btn delete-btn" id="deleteBtn">Удалить</button>
                        <button class="btn save-btn" id="saveBtn">Сохранить</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Overlay -->
        <div class="overlay" id="overlay"></div>

        <!-- Time Selection Modal (for precise time selection) -->
        <div class="time-modal" id="timeModal">
            <div class="time-modal-content">
                <h3>Выберите время</h3>
                <div class="time-selector">
                    <select id="startHourSelect" class="time-select"></select>
                    <span>:</span>
                    <select id="startMinuteSelect" class="time-select"></select>
                    <span>-</span>
                    <select id="endHourSelect" class="time-select"></select>
                    <span>:</span>
                    <select id="endMinuteSelect" class="time-select"></select>
                </div>
                <div class="time-modal-actions">
                    <button class="btn" id="cancelTimeBtn">Отмена</button>
                    <button class="btn save-btn" id="applyTimeBtn">Применить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
